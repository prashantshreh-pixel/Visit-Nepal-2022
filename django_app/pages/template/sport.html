{% extends 'base.html' %} 
{% load static %} 
{% block content %}
<style>
  #background {
    background: linear-gradient(to bottom, rgba(0, 0, 0, 0.2) 0%, rgba(0, 0, 0, 0.4) 60%, var(--bg-body) 100%), url("{% static 'images/sport.jpg' %}");
    height: 100vh;
    background-position: center center;
    background-size: cover;
    background-attachment: fixed;
    position: relative;
  }

  .culture_titles {
    font-family: great_wishes, cursive;
    letter-spacing: 12px;
    text-shadow: 5px 5px 15px rgba(0,0,0,0.6);
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-25.5deg);
    -webkit-transform: translate(-50%, -50%) rotate(-25.5deg);
    color: white;
    font-size: 100px;
    font-weight: bold;
    text-align: center;
    width: 100%;
    z-index: 10;
    margin: 0;
    white-space: nowrap;
  }

  .content-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    overflow: hidden;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    box-shadow: var(--card-shadow);
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  .content-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.5);
  }

  .card-img-wrapper {
    position: relative;
    height: 240px;
    overflow: hidden;
  }

  .card-img-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
  }

  .content-card:hover .card-img-wrapper img {
    transform: scale(1.08);
  }

  .card-category-badge {
    position: absolute;
    top: 15px;
    left: 15px;
    background: rgba(2, 119, 189, 0.9);
    color: #ffffff;
    font-size: 0.8rem;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
    text-transform: uppercase;
  }

  .card-body-custom {
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
  }

  .card-title-custom {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--text-color);
    margin-bottom: 0.75rem;
  }

  .card-desc-custom {
    color: var(--text-muted);
    font-size: 0.95rem;
    line-height: 1.6;
    flex-grow: 1;
    margin-bottom: 1.25rem;
  }

  .btn-explore {
    background: var(--primary-accent);
    color: #ffffff !important;
    font-weight: 600;
    border-radius: 8px;
    padding: 8px 18px;
    text-decoration: none;
    display: inline-block;
    transition: opacity 0.2s ease;
    align-self: start;
  }

  .btn-explore:hover {
    opacity: 0.9;
  }
</style>

<!-- Full 100vh Cover Background Image with Centered Title -->
<div id="background" class="img-fluid">
  <div class="culture_titles">
    <h1>Sports</h1>
  </div>
</div>

<section id="project" class="py-5" style="background-color: var(--bg-body);">
  <div class="container my-5 py-4">
    <h4 class="fw-bold mb-4" style="color: var(--text-color); font-size: 38px;">
      Popular Adventure Sports
    </h4>

    <!-- 3x3 Grid Layout -->
    <div class="row g-4">
      {% for post in posts %}
      <div class="col-lg-4 col-md-6 col-sm-12">
        <div class="content-card">
          <div class="card-img-wrapper">
            <img src="{{ post.image.url }}" alt="{{ post.title }}" />
            <span class="card-category-badge">Sport</span>
          </div>
          <div class="card-body-custom">
            <h3 class="card-title-custom">{{ post.title }}</h3>
            <p class="card-desc-custom">{{ post.description|truncatewords:22 }}</p>
            <a href="/post?id={{ post.id }}" class="btn-explore">
              Explore Details <i class="fa-solid fa-arrow-right ms-1"></i>
            </a>
          </div>
        </div>
      </div>
      {% empty %}
      <div class="col-12 text-center py-5">
        <i class="fa-solid fa-person-hiking fa-3x text-muted mb-3"></i>
        <h4 class="text-muted">No adventure sport posts found.</h4>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
{% endblock %}

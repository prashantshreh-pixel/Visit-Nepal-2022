{% extends 'base.html' %}
{% load static %}
{% block content %}
<style>
  .chat-page-hero {
    background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.8)), url("{% static 'images/buddhaBg.jpg' %}");
    min-height: 100vh;
    background-position: center;
    background-size: cover;
    background-attachment: fixed;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: 100px;
    padding-bottom: 50px;
  }

  .chat-card-container {
    width: 100%;
    max-width: 800px;
    height: 650px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .chat-header {
    background: #1e1e1e;
    color: #ffffff;
    padding: 20px 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #2d2d2d;
  }

  .chat-messages {
    flex: 1;
    padding: 25px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: var(--bg-body);
  }

  .page-chat-msg {
    max-width: 75%;
    padding: 12px 18px;
    border-radius: 18px;
    font-size: 0.98rem;
    line-height: 1.6;
    word-wrap: break-word;
  }

  .page-chat-msg.bot {
    align-self: flex-start;
    background: var(--bg-card);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    border-bottom-left-radius: 4px;
  }

  .page-chat-msg.user {
    align-self: flex-end;
    background: var(--primary-accent);
    color: #ffffff;
    border-bottom-right-radius: 4px;
  }

  .chat-input-bar {
    padding: 15px 25px;
    background: var(--bg-card);
    border-top: 1px solid var(--border-color);
    display: flex;
    gap: 12px;
  }

  .chat-input-bar input {
    flex: 1;
    background: var(--bg-body);
    color: var(--text-color);
    border: 1px solid var(--border-color);
    border-radius: 25px;
    padding: 12px 22px;
    font-size: 1rem;
    outline: none;
  }

  .chat-input-bar button {
    background: var(--primary-accent);
    color: #ffffff;
    border: none;
    padding: 0 25px;
    border-radius: 25px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s ease;
  }

  .chat-input-bar button:hover {
    opacity: 0.9;
  }
</style>

<div class="chat-page-hero">
  <div class="chat-card-container">
    <div class="chat-header">
      <div class="d-flex align-items-center">
        <i class="fa-solid fa-robot text-warning me-3 fs-3"></i>
        <div>
          <h4 class="mb-0 fw-bold">Zazman AI Assistant</h4>
          <small class="text-success">● Connected to Rasa Engine</small>
        </div>
      </div>
    </div>

    <div class="chat-messages" id="pageChatMsgs">
      <div class="page-chat-msg bot">
        Namaste! 🙏 Welcome to Visit Nepal 2022. Ask me anything about travel destinations, heritage sites, Pokhara, adventure sports, or hotel bookings!
      </div>
    </div>

    <div class="chat-input-bar">
      <input type="text" id="pageChatInput" placeholder="Type your travel question here..." />
      <button type="button" id="pageChatSendBtn"><i class="fa-solid fa-paper-plane me-2"></i>Send</button>
    </div>
  </div>
</div>

<script>
  const pageChatMsgs = document.getElementById('pageChatMsgs');
  const pageChatInput = document.getElementById('pageChatInput');
  const pageChatSendBtn = document.getElementById('pageChatSendBtn');

  function addPageMessage(text, sender) {
    const div = document.createElement('div');
    div.className = `page-chat-msg ${sender}`;
    div.textContent = text;
    pageChatMsgs.appendChild(div);
    pageChatMsgs.scrollTop = pageChatMsgs.scrollHeight;
  }

  async function handlePageSendMessage() {
    const text = pageChatInput.value.trim();
    if (!text) return;

    addPageMessage(text, 'user');
    pageChatInput.value = '';

    try {
      const res = await fetch('http://localhost:5005/webhooks/rest/webhook', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sender: 'page_user', message: text })
      });

      if (!res.ok) throw new Error('Offline');

      const data = await res.json();
      if (data && data.length > 0) {
        data.forEach(item => {
          if (item.text) addPageMessage(item.text, 'bot');
        });
      } else {
        addPageMessage("I couldn't find an answer to that. Try asking about Kathmandu, Pokhara, heritage sites, or trekking!", 'bot');
      }
    } catch (e) {
      addPageMessage("⚠️ Rasa bot server is offline. Please make sure Rasa is running via 'python run_all.py'!", 'bot');
    }
  }

  pageChatSendBtn.addEventListener('click', handlePageSendMessage);
  pageChatInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') handlePageSendMessage();
  });
</script>
{% endblock content %}
